services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: distributed-job-queue-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_queue
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_queue"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: distributed-job-queue-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: distributed-job-queue-api
    command: ["node", "dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: job_queue
      DB_SYNC: "true"
      DB_LOGGING: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: distributed-job-queue-worker
    command: ["node", "dist/worker-main.js"]
    environment:
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: job_queue
      DB_SYNC: "true"
      DB_LOGGING: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: 5

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      GEMINI_COMPLETION_MODEL: gemini-3.6-flash
      CACHE_SIMILARITY_THRESHOLD: "0.92"
      CACHE_TTL_MS: "86400000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: